/* debts + reminders */
const normN=str=>(str||'').trim().toLowerCase();
const consolidateDebts=()=>{
  if(!S.debts||!S.debts.length)return;
  const map={}, settled=[];
  S.debts.forEach(d=>{
    const rem=d.a-(d.paid||0);
    if(rem<=0){settled.push(d);return;}
    const k=normN(d.n);
    if(!map[k])map[k]={name:d.n.trim(),net:0,lastD:d.d,ids:[]};
    map[k].ids.push(d.id);
    map[k].lastD=d.d;
    if(d.t==='owe')map[k].net+=rem;
    else map[k].net-=rem;
  });
  const res=[...settled];
  Object.values(map).forEach(g=>{
    if(g.net>0){
      res.push({id:g.ids[0]||now(),n:g.name,a:g.net,t:'owe',paid:0,d:g.lastD||dk()});
    } else if(g.net<0){
      res.push({id:g.ids[0]||now(),n:g.name,a:Math.abs(g.net),t:'owed',paid:0,d:g.lastD||dk()});
    }
  });
  S.debts=res;
};

    const curRem=existing.a-(existing.paid||0);
    if(existing.t===t){
      existing.a+=a;
      existing.d=dk();
    }else{
      if(curRem>a){
        existing.paid=(existing.paid||0)+a;
      }else if(curRem===a){
        existing.paid=existing.a;
      }else{
        existing.paid=existing.a;
        S.debts.push({id:now(),n:existing.n,a:a-curRem,t,paid:0,d:dk()});

};

const lt=r=>{const l=left(r);return l<0?'Passed':l==0?'Today!':l+(l==1?' day left':' days left')};
const lc=l=>l<=3?CR:l<=10?CY:'var(--bl)';
function reminders(){const rs=[...S.rem].sort((a,b)=>a.d<b.d?-1:1);
return `<h2>Reminders</h2>${rs.map(r=>{const l=left(r);return `<div class="card row" style="${l<0?'':tint(lc(l))}"><div><b>${esc(r.t)}</b><div class="mut">${r.d}</div></div><div class="row"><span class="big" style="font-size:18px;color:${l<0?'var(--mut)':lc(l)}">${lt(r)}</span><button class="x" onclick="delR(${r.id})" aria-label="Delete">✕</button></div></div>`}).join('')||'<p class="mut" style="margin-bottom:12px">No reminders yet. Add an exam or a trip below.</p>'}
<div class="card"><h3>Add reminder</h3><div class="f"><input id="rt" placeholder="Exam, trip, project…"><input id="rd" type="date"></div><div class="f"><button class="btn" onclick="addR()" style="width:100%">+ Add reminder</button></div></div>`}
const streakTier=d=>{
  if(d>=365)return{n:'Diamond',i:'💎',c:'#00f2ff'};
  if(d>=200)return{n:'Platinum',i:'💠',c:'#e5e4e2'};
  if(d>=100)return{n:'Gold',i:'🥇',c:'#ffd700'};
  if(d>=50)return{n:'Bronze',i:'🥉',c:'#cd7f32'};
  return{n:'',i:'🔥',c:'#ff763b'};
};
const streakTag=d=>{
  const t=streakTier(d);
  const l=t.n?`${t.i} ${t.n} · ${d}d`:`${t.i} ${d}d streak`;
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.07);color:${t.c};border:1px solid color-mix(in srgb,${t.c} 30%,transparent);margin-top:4px">${l}</span>`;
};
function studyStreak(){
  const gm=goal()*36e5;
  let count=0;
  const d=new Date();
  const todayDone=todayMs()>0;
  if(todayDone){
    count++;
    d.setDate(d.getDate()-1);
  } else {
    const yest=new Date();
    yest.setDate(yest.getDate()-1);
    if((S.study[dk(yest)]||0)<=0)return 0;
    d.setDate(d.getDate()-1);
  }
  while(true){
    const k=dk(d);
    if((S.study[k]||0)>0){
      count++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return count;
}
function chkStreak(){
  if(!S.hab||!S.hab.length)return 0;
  let count=0;
  const d=new Date();
  const isDone=k=>S.hab.filter(h=>h.done[k]).length>=Math.ceil(S.hab.length*0.5);
  const todayDone=isDone(dk(d));
  if(todayDone){
    count++;
    d.setDate(d.getDate()-1);
  } else {
    const yest=new Date();
    yest.setDate(yest.getDate()-1);
    if(!isDone(dk(yest)))return 0;
    d.setDate(d.getDate()-1);
  }
  while(true){
    const k=dk(d);
    if(isDone(k)){
      count++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return count;
}
/* dashboard */
const gauge=(p,c)=>`<div class="gw"><svg viewBox="0 0 110 66" width="120" style="display:block"><path d="M10 58A45 45 0 0 1 100 58" fill="none" stroke="#222d4a" stroke-width="10" stroke-linecap="round"/><path d="M10 58A45 45 0 0 1 100 58" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(p*1.4137).toFixed(1)} 142"/></svg><div class="gt">${S.hab.filter(h=>h.done[dk()]).length}/${S.hab.length}</div></div>`;
function dash(){const b=budget(),di=dayInfo(),tl=cigL(),tp=pcH(dk()),st=studyStat(),hc=cChk(tp),sc=cPct(st.p),cc=cCig(tl.n);
const rems=[...S.rem].filter(r=>left(r)>=0).sort((a,b)=>a.d<b.d?-1:1),soon=rems.some(r=>left(r)<=3);
const ups=rems.map(r=>{const l=left(r),c=lc(l);return `<div class="uc" style="--c:${c}" onclick="go(7)"><div class="mut">${esc(r.t)}:</div><b>${lt(r)}</b>${bar(100-Math.min(l,30)/30*100,c)}</div>`}).concat(S.debts.filter(d=>d.a>d.paid).map(d=>{const c=d.t=='owe'?CR:CG;return `<div class="uc" style="--c:${c}" onclick="go(6)"><div class="mut">Debt · ${d.t=='owe'?'I owe':'owes me'}</div><b>${esc(d.n)} (${inr(d.a-d.paid)})</b>${bar(d.paid/d.a*100,c)}</div>`}));
return `<div class="row" style="margin-bottom:14px"><div><div class="mut">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}</div><div class="hd">Hey ${esc(uName())}!</div><div class="brand">🎓 Bachelor Buddy${window.CL?.user?` · <span id="syn" style="color:var(--mut);font-size:12px;font-weight:400">${esc(window.CL.st||'Synced ✓')}</span>`:''}</div></div><div class="row" style="gap:6px">${window.CL?.user?`<button class="btn o s" style="padding:6px 10px;font-size:12px" onclick="cloudOut()">Sign out</button>`:''}<button class="bell" onclick="go(7)" aria-label="Reminders">🔔${soon?'<i></i>':''}</button></div></div>
${acct()}${syl()}<div class="g2"><div class="card" onclick="go(2)" style="${tint(sc)}"><div class="row" style="align-items:flex-start"><div><div class="mut">Monthly study</div>${streakTag(studyStreak())}</div></div><div class="ring" style="--p:${st.p};--c:${sc}"><span>${st.p}%</span></div><div class="mut" style="text-align:center">Today ${hm(todayMs())}</div></div>
<div class="card" onclick="go(3)" style="${tint(b.c)}"><div class="mut">Budget (${S.mode=='day'?'today':'month'})</div><div class="big" style="margin-top:8px;color:${b.c}">${inr(b.rem)}</div><div class="mut">${b.rem<0?'over target':'remaining'}</div>${bar(b.p,b.c)}</div>
<div class="card" onclick="go(4)" style="${tint(cc)}"><div class="row" style="align-items:flex-start"><div><div class="mut">${esc(cfg().n)} (Active)</div><div class="big" style="margin-top:6px;font-size:38px;color:${cc}">${tl.n}</div><div class="mut">Today (₹${tl.c})</div></div><span style="font-size:32px">${esc(cfg().i)}</span></div>${(()=>{
  const others=Object.entries(S.items||{}).filter(([name,it])=>name!==S.activeItem&&((it.log[dk()]||{}).n>0)).map(([name,it])=>`${it.cfg?.i||'✨'} ${esc(name)} (${it.log[dk()].n})`);
  return others.length?`<div class="mut" style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px">Also today: ${others.join(' · ')}</div>`:'';
})()}</div>
<div class="card" onclick="go(5)" style="${tint(hc)}"><div class="row" style="align-items:flex-start"><div><div class="mut">Daily checklist</div>${streakTag(chkStreak())}</div></div>${gauge(tp,hc)}<div class="mut" style="text-align:center">Done (${tp}%)</div></div></div>
<div class="card" style="${tint(di.c)}"><div class="row"><div><div class="mut">Quick spend · today</div><div class="big" style="color:${di.c}">${inr(di.td)}</div></div><div class="mut" style="text-align:right">safe limit<br><b style="color:var(--tx)">${inr(di.lim)}</b></div></div>${bar(di.p,di.c)}<div class="f">${[10,20,50,100].map(a=>`<button class="btn o s" style="flex:1" onclick="qs(${a})">+₹${a}</button>`).join('')}</div><div class="f"><input id="qa" type="number" inputmode="numeric" placeholder="Other amount ₹"><button class="btn s" onclick="addQ()">Add</button></div></div>
<h3 style="margin:16px 0 8px">Upcoming reminders and debts</h3><div class="hs">${ups.join('')||'<p class="mut">Nothing coming up. Add a reminder or a debt.</p>'}</div>`}
/* account + history */
function acct(){const c=window.CL;if(c.on===null||c.user)return '';
if(!c.on)return `<div class="card" style="${tint(CY)}"><b>Sync is off</b><div class="mut">Add your Firebase config to turn on Google sign-in. For now data stays on this phone.</div></div>`;
return `<div class="card row" style="${tint('var(--bl)')}"><div class="mut" style="flex:1;color:var(--tx)">Sign in to back up your data and use it on any phone.</div><button class="btn s" onclick="cloudIn()">Sign in with Google</button></div><div class="mut" id="syn" style="margin:-6px 0 10px">${esc(c.st||'')}</div>`}
function mStats(ym){
  const[y,m]=ym.split('-').map(Number),cm=ym==tm()?new Date().getDate():new Date(y,m,0).getDate(),gm=goal()*36e5;
  let ms=0,sd=0,hp=0;
  for(let d=1;d<=cm;d++){const k=ym+'-'+pad(d),v=k==dk()?todayMs():(S.study[k]||0);ms+=v;sd+=Math.min(1,v/gm);hp+=pcH(k)}
  
  const itemsBreakdown=[];
  let totalItemCost=0, totalItemCount=0;
  for(const [name, it] of Object.entries(S.items||{})){
    let totalN=0, totalC=0;
    for(const [d, val] of Object.entries(it.log||{})){
      if(d.startsWith(ym)){
        totalN += (val.n||0);
        totalC += (val.c||0);
      }
    }
    if(totalN>0||totalC>0){
      itemsBreakdown.push({name, n:totalN, c:totalC, i:it.cfg?.i||'✨'});
      totalItemCost += totalC;
      totalItemCount += totalN;
    }
  }
  return {cm,ms,stp:Math.round(sd/cm*100),chk:Math.round(hp/cm),itemsBreakdown,totalItemCost,totalItemCount,ex:spentOn(ym)};
}
function history(){
  const MS=[];
  for(let i=0;i<12;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);MS.push({d,a:mStats(d.getFullYear()+'-'+pad(d.getMonth()+1))})}
  const has=a=>a.ms>0||a.ex>0||a.totalItemCount>0||a.chk>0;
  const act=MS.filter(m=>has(m.a));
  const T=act.reduce((t,m)=>({ms:t.ms+m.a.ms,ex:t.ex+m.a.ex,itemCost:t.itemCost+m.a.totalItemCost,k:t.k+m.a.chk}),{ms:0,ex:0,itemCost:0,k:0});
  const ak=act.length?Math.round(T.k/act.length):0;
  
  const yearItemsMap={};
  for(const [name, it] of Object.entries(S.items||{})){
    let totalN=0, totalC=0;
    for(const [d, val] of Object.entries(it.log||{})){
      totalN += (val.n||0);
      totalC += (val.c||0);
    }
    if(totalN>0||totalC>0){
      yearItemsMap[name]={name, n:totalN, c:totalC, i:it.cfg?.i||'✨'};
    }
  }

  const bars=[...MS].reverse().map(m=>`<div style="flex:1;text-align:center"><div style="height:60px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(4,m.a.stp*.6)}px;border-radius:5px;background:${has(m.a)?cPct(m.a.stp):'#222d4a'}"></div></div><div class="mut" style="font-size:10px">${m.d.toLocaleDateString('en-IN',{month:'short'})}</div></div>`).join('');

  return `<h2>Year record</h2>
  <div class="card">
    <h3>Last 12 months</h3>
    <div class="g2" style="margin:10px 0 0">
      <div><div class="mut">Study</div><b>${hm(T.ms)}</b></div>
      <div><div class="mut">General Spent</div><b>${inr(T.ex)}</b></div>
      <div><div class="mut">Tracked Items</div><b>${inr(T.itemCost)}</b></div>
      <div><div class="mut">Checklist average</div><b style="color:${cPct(ak)}">${ak}%</b></div>
    </div>
    ${Object.keys(yearItemsMap).length?`
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08)">
        <div class="mut" style="margin-bottom:6px">Tracked items total:</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${Object.values(yearItemsMap).map(it=>`<span style="font-size:12px;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,0.06);color:#ffffff">${it.i} ${esc(it.name)}: <b>${it.n}</b> (${inr(it.c)})</span>`).join('')}
        </div>
      </div>`:''}
  </div>
  <div class="card"><h3 style="margin-bottom:10px">Study each month (vs your daily goal)</h3><div class="row" style="gap:4px;align-items:flex-end">${bars}</div></div>`+
  MS.map(m=>{
    const a=m.a,h=has(a);
    return `<div class="card" style="${h?'':'opacity:.5'}">
      <div class="row">
        <h3>${m.d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3>
        ${h?'':'<span class="mut">No data</span>'}
      </div>
      ${h?`<div class="g2" style="margin:10px 0 0">
        <div><div class="mut">Study</div><b style="color:${cPct(a.stp)}">${hm(a.ms)} · ${a.stp}%</b></div>
        <div><div class="mut">Spent</div><b style="color:${cBud(a.ex/S.tg.month*100)}">${inr(a.ex)}</b></div>
        <div><div class="mut">Checklist</div><b style="color:${cPct(a.chk)}">${a.chk}%</b></div>
        <div><div class="mut">Items Spent</div><b>${inr(a.totalItemCost)}</b></div>
      </div>
      ${a.itemsBreakdown.length?`
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-wrap:wrap;gap:6px">
          ${a.itemsBreakdown.map(it=>`<span style="font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.06);color:#ffffff">${it.i} ${esc(it.name)}: <b>${it.n}</b> (${inr(it.c)})</span>`).join('')}
        </div>`:''}`:''}
    </div>`;
  }).join('')+
  `<p class="mut" style="text-align:center">Every month stays saved, including older ones.</p>`;
}
R();
</script>
<script src="config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig=window.FIREBASE_CONFIG||{apiKey:""};
const CL=window.CL,BB=window.BB;
const note=t=>{CL.st=t;const e=document.getElementById('syn');if(e)e.textContent=t};
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith("PASTE")){CL.on=false;BB.render()}else{
CL.on=true;
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let ref=null,unsub=null,tm=null;
const write=async()=>{try{const S=BB.get();await setDoc(ref,{data:JSON.stringify(S),ts:S.ts||Date.now()});note('Synced ✓')}catch(e){note('Sync failed. Will retry on the next change.')}};
window.cloudPush=()=>{if(!ref)return;note('Saving…');clearTimeout(tm);tm=setTimeout(write,1200)};
window.cloudIn=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,p);else note('Sign-in failed ('+(e.code||'error')+')')}};
window.cloudOut=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 CL.user=u?{n:u.displayName||u.email}:null;
 if(unsub){unsub();unsub=null}
 if(!u){ref=null;CL.st='';BB.render();return}
 ref=doc(db,'users',u.uid);CL.st='Syncing…';BB.render();
 try{const snap=await getDoc(ref),loc=BB.get();
  if(snap.exists()){const r=JSON.parse(snap.data().data);if((r.ts||0)>(loc.ts||0)){BB.set(r);note('Synced ✓')}else write()}else write()}
 catch(e){note('Could not reach the cloud. Using data on this phone.')}
 unsub=onSnapshot(ref,x=>{if(x.metadata.hasPendingWrites||!x.exists())return;try{const r=JSON.parse(x.data().data);if((r.ts||0)>(BB.get().ts||0))BB.set(r)}catch(e){}});
});
}
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
