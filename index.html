/* Apple iOS Widget Styling & Glassmorphic Materials */
.ios-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}
.ios-widget-1x1 {
  grid-column: span 1;
  min-height: 154px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.ios-widget-2x1 {
  grid-column: span 2;
  min-height: 128px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
@keyframes iosWiggle {
  0% { transform: rotate(-0.7deg) scale(0.996); }
  50% { transform: rotate(0.7deg) scale(1.004); }
  100% { transform: rotate(-0.7deg) scale(0.996); }
}
.ios-editing {
  animation: iosWiggle 0.28s infinite ease-in-out;
  transform-origin: center center;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}
.ios-editing:nth-child(even) {
  animation-duration: 0.32s;
  animation-direction: reverse;
}
.ios-widget-del {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(60,60,67,0.95);
  border: 1.5px solid rgba(255,255,255,0.7);
  color: #ffffff;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  z-index: 30;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  line-height: 1;
  padding: 0;
}
.ios-widget-resize {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255,255,255,0.6);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  z-index: 30;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  line-height: 1;
}
.ios-add-card {
  border: 2px dashed rgba(255,255,255,0.25);
  border-radius: 24px;
  padding: 18px;
  text-align: center;
  color: #ffffff;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
  margin: 10px 0;
  transition: all 0.15s ease;
}
.ios-add-card:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.45);
}
.qs-btn {
  background: rgba(255, 255, 255, 0.09) !important;
  border: 1px solid rgba(255, 255, 255, 0.14) !important;
  color: #ffffff !important;
  border-radius: 13px !important;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}
.qs-btn:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.22) !important;
}
.ios-widget.dragging {
  opacity: 0.35 !important;
  transform: scale(0.95) !important;
}
.ios-widget.drag-over {
  border-color: var(--ac) !important;
  box-shadow: 0 0 20px var(--ac), inset 0 0 10px var(--ac) !important;
  transform: scale(1.02) !important;
}
.ios-widget-reorder {
  position: absolute;
  bottom: 6px;
  right: 6px;
  display: flex;
  gap: 3px;
  z-index: 30;
}
.ios-widget-reorder button {
  background: rgba(255, 255, 255, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #ffffff;
  border-radius: 8px;
  width: 22px;
  height: 20px;
  font-size: 10px;
  font-weight: 800;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  transition: transform 0.1s ease, background 0.15s ease;
}
.ios-widget-reorder button:active {
  transform: scale(0.88);
  background: rgba(255, 255, 255, 0.5);
}
.ios-widget {
  background: rgba(28,28,30,.76) !important;
  backdrop-filter: blur(28px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), 0 10px 30px -4px rgba(0,0,0,.45) !important;
  border-radius: 24px !important;
  padding: 16px;
  position: relative;
  overflow: hidden;
  transition: transform .14s ease, border-color .18s ease;
}

}
.ios-widget:active { transform: scale(.98); }
.ios-widget-title {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;

}
.ios-badge {
  display: inline-flex;

}
.ios-badge.green { background: rgba(48,209,88,.16); color: #30d158; border: 1px solid rgba(48,209,88,.3); }
.ios-badge.blue { background: rgba(10,132,255,.16); color: #0a84ff; border: 1px solid rgba(10,132,255,.3); }
.ios-badge.orange { background: rgba(255,159,10,.16); color: #ff9f0a; border: 1px solid rgba(255,159,10,.3); }
.ios-badge.red { background: rgba(255,69,58,.16); color: #ff453a; border: 1px solid rgba(255,69,58,.3); }

/* iOS Segmented Control Slider */
.d-switch {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  background: rgba(118,118,128,.24) !important;
  border: 1px solid rgba(255,255,255,.08) !important;
  padding: 3px !important;
  border-radius: 16px !important;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.3) !important;
}
.d-switch button {
  background: none;
  border: 0;
  color: #8e8e93;
  padding: 8px 4px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 13px;
  cursor: pointer;
  transition: all .2s cubic-bezier(.2,.8,.2,1);
}
.d-switch button.a {
  background: rgba(255,255,255,.18) !important;
  color: #ffffff !important;
  box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15) !important;
}

/* Floating iOS Tab Bar */
nav {
  margin: 0 14px max(12px, env(safe-area-inset-bottom, 12px)) !important;
  border-radius: 28px !important;
  background: rgba(22, 22, 24, 0.86) !important;
  backdrop-filter: blur(28px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14) !important;
  padding: 5px !important;
}
nav button.a {
  background: rgba(255, 255, 255, 0.16) !important;
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
  color: #ffffff !important;
}
nav button {
  min-width: 60px !important;
  color: #8e8e93 !important;
  font-size: 10px !important;
  font-weight: 600 !important;
  border-radius: 20px !important;
}
nav .a {
  color: #ffffff !important;
  background: rgba(255,255,255,.15) !important;
  border: 1px solid rgba(255,255,255,.1) !important;
  box-shadow: 0 3px 10px rgba(0,0,0,.3) !important;
}
nav .a b { filter: drop-shadow(0 0 6px var(--ac)) !important; }
h2{font-size:22px;margin:4px 0 14px;color:#ffffff;font-weight:700}h3{font-size:16px;font-weight:600}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.g2 .card{margin:0}

/* College Domain: Attendance & Bunk Calculator with Insights */
const calcBunk=(att,tot,tgt)=>{
  const R=(tgt||75)/100;
  const p=tot?Math.round((att/tot)*100):(att?100:0);
  if(tot===0) return {p:0, safe:0, need:0, ok:true};
  if(p>=tgt){
    const safe=Math.floor((att - R*tot)/R);
    return {p, safe:Math.max(0,safe), need:0, ok:true};
  } else {
    const need=Math.ceil((R*tot - att)/(1-R));
    return {p, safe:0, need:Math.max(0,need), ok:false};
  }
};

/* CGPA & SGPA Calculator */
const GRADES=[['O',10],['A+',9],['A',8],['B+',7],['B',6],['C',5],['P',4],['F',0]];
function cgpaCalc(){
  // Current sem SGPA:
  const curTotCred=S.cgpa.courses.reduce((a,c)=>a+c.cred,0);
  const curTotPts=S.cgpa.courses.reduce((a,c)=>a+(c.cred*c.grade),0);
  const curSgpa=curTotCred?((curTotPts/curTotCred).toFixed(2)):0;

  // Cumulative CGPA:
  const allSemCred=S.cgpa.semesters.reduce((a,s)=>a+s.cred,0);
  const allSemPts=S.cgpa.semesters.reduce((a,s)=>a+(s.cred*s.sgpa),0);
  const totalCred=allSemCred+curTotCred;
  const totalPts=allSemPts+curTotPts;
  const cgpa=totalCred?((totalPts/totalCred).toFixed(2)):curSgpa;

  return `<h2>🎯 CGPA & SGPA Calculator</h2>
  <div class="g2" style="margin-bottom:12px">
    <div class="card" style="${tint('var(--bl)')}">
      <div class="mut">Current Sem SGPA</div>
      <div class="big" style="color:var(--bl);font-size:36px">${curSgpa}</div>
      <div class="mut">${curTotCred} Credits</div>
    </div>
    <div class="card" style="${tint('var(--pu)')}">
      <div class="mut">Cumulative CGPA</div>
      <div class="big" style="color:var(--pu);font-size:36px">${cgpa}</div>
      <div class="mut">${totalCred} Total Credits</div>
    </div>
  </div>

  <div class="card">
    <h3>Semester Courses (SGPA Calculation)</h3>
    ${S.cgpa.courses.map((c,i)=>`<div class="row it" style="cursor:default">
      <div><b>${esc(c.n)}</b> <span class="mut">(${c.cred} credits · Grade ${GRADES.find(g=>g[1]===c.grade)?.[0]||c.grade})</span></div>
      <div><b>${c.cred*c.grade} pts</b><button class="x" onclick="delCgpaCourse(${i})">✕</button></div>
    </div>`).join('')||'<p class="mut">No courses added. Add below!</p>'}
    
    <div class="f" style="margin-top:10px">
      <input id="cg_cname" placeholder="Course Name" style="flex:2">
      <input id="cg_ccred" type="number" placeholder="Credits" value="4" style="flex:1">
      <select id="cg_cgrade" style="flex:1.2">
        ${GRADES.map(g=>`<option value="${g[1]}" ${g[1]===9?'selected':''}>${g[0]} (${g[1]})</option>`).join('')}
      </select>
      <button class="btn" onclick="addCgpaCourse()">+ Add</button>
    </div>
  </div>

  <div class="card">
    <h3>Previous Semesters SGPA</h3>
    ${S.cgpa.semesters.map((s,i)=>`<div class="row it" style="cursor:default">
      <div><b>Semester ${s.sem}</b> <span class="mut">(${s.cred} credits)</span></div>
      <div><b style="color:var(--cy)">${s.sgpa}</b><button class="x" onclick="delCgpaSem(${i})">✕</button></div>
    </div>`).join('')||'<p class="mut">No past semesters recorded.</p>'}
    
    <div class="f" style="margin-top:10px">
      <input id="cg_snum" type="number" placeholder="Sem #" style="flex:1">
      <input id="cg_sgpa" type="number" step="0.01" placeholder="SGPA" style="flex:1.5">
      <input id="cg_scred" type="number" placeholder="Credits" value="20" style="flex:1.5">
      <button class="btn" onclick="addCgpaSem()">+ Sem</button>
    </div>
  </div>`;
}

window.addFlatmate=()=>{

window.splitBill=()=>{
  const title=val('#sp_title')||'Flat Expense';
  const a=+val('#sp_amt');
  const paidBy=val('#sp_paidby')||S.flatmates[0];
  const d=val('#sp_date')||dk();
  if(!(a>0)||!S.flatmates.length)return;

  const share=Math.round(a/S.flatmates.length);
  S.splits.push({id:now(),d,title,a,paidBy,share,count:S.flatmates.length});

  // Automatically add to debts for other flatmates!
  S.flatmates.forEach(f=>{
    if(f.trim().toLowerCase()!==paidBy.trim().toLowerCase()){
      // Flatmate f owes paidBy 'share'
      // If the user is paidBy: f owes user ('owed')
      // If user is f: user owes paidBy ('owe')
      const userN=NAME.toLowerCase();
      if(paidBy.toLowerCase()===userN){
        // Others owe user
        addCustomDebt(f,share,'owed');
      } else if(f.toLowerCase()===userN){
        // User owes paidBy
        addCustomDebt(paidBy,share,'owe');
      } else {
        // Between two other flatmates, track under paidBy ledger
        addCustomDebt(`${f} (via ${paidBy})`,share,'owed');
      }
    }
  });

  save();R();
};
const addCustomDebt=(name,amt,type)=>{
  consolidateDebts();
  const k=normN(name);
  const existing=S.debts.find(x=>normN(x.n)===k&&(x.a-(x.paid||0)>0));
  if(existing){
    const curRem=existing.a-(existing.paid||0);
    if(existing.t===type){
      existing.a+=amt;
    }else{
      if(curRem>amt){
        existing.paid=(existing.paid||0)+amt;
      }else if(curRem===amt){
        existing.paid=existing.a;
      }else{
        existing.paid=existing.a;
        S.debts.push({id:now(),n:existing.n,a:amt-curRem,t:type,paid:0,d:dk()});
      }
    }
  }else{
    S.debts.push({id:now(),n:name,a:amt,t:type,paid:0,d:dk()});
  }
};

function playAlarmChime(){
window.playAlarmChime=playAlarmChime;

  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(587.33,ctx.currentTime);
    osc.frequency.setValueAtTime(880,ctx.currentTime+0.15);
    gain.gain.setValueAtTime(0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+0.6);
  }catch(e){}
};

function showPhoneNotif(title,body,tag){
window.showPhoneNotif=showPhoneNotif;

  playAlarmChime();
  if(window.Notification && window.Notification.permission==='granted'){
    try{
      if(typeof navigator!=='undefined' && 'serviceWorker' in navigator && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(reg=>{
          reg.showNotification(title,{
            body,
            icon:'/icon.png',
            badge:'/icon.png',
            vibrate:[200,100,200],
            tag:tag||'bb-alert'
          });
        }).catch(()=>{});
      } else if(typeof window.Notification === 'function'){
        new window.Notification(title,{body,icon:'/icon.png'});
      }
    }catch(e){}
  }
};

  }
  const el = e.currentTarget;
  setTimeout(() => el && el.classList.add('dragging'), 0);
};

window.onWidgetDragOver = (e) => {
  if (!window._isEditMode) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  if (el && !el.classList.contains('drag-over')) {
    document.querySelectorAll('.ios-widget.drag-over').forEach(x => x.classList.remove('drag-over'));
    el.classList.add('drag-over');
  }
};

window.onWidgetDragLeave = (e) => {
  if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
};

window.onWidgetDrop = (e, targetKey) => {
  if (!window._isEditMode) return;
  e.preventDefault();
  if (e.currentTarget) e.currentTarget.classList.remove('drag-over');
  const sourceKey = window._draggedWidgetKey || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  if (!sourceKey || sourceKey === targetKey) return;

  if (!S.widgetOrder) S.widgetOrder = ['budget', 'study', 'quickSpend', 'attendance', 'checklist', 'item', 'syl', 'deadlines', 'reminders'];
  const fromIdx = S.widgetOrder.indexOf(sourceKey);
  const toIdx = S.widgetOrder.indexOf(targetKey);
  if (fromIdx !== -1 && toIdx !== -1) {
    const item = S.widgetOrder.splice(fromIdx, 1)[0];
    S.widgetOrder.splice(toIdx, 0, item);
    save();
    R();
  }
  window._draggedWidgetKey = null;
};

window.onWidgetDragEnd = (e) => {
  if (typeof document !== 'undefined') {
    document.querySelectorAll('.ios-widget').forEach(x => {
      x.classList.remove('dragging');
      x.classList.remove('drag-over');
    });
  }
  window._draggedWidgetKey = null;
};
window._lpTimer = null;

window.toggleEditMode = (force) => {
  window._isEditMode = (typeof force === 'boolean') ? force : !window._isEditMode;
  R();
};

window.toggleWidgetSize = (key) => {
  if (!S.widgetSizes) S.widgetSizes = {};

};

window.startWidgetLongPress = () => {

window.autoGenerateStudyPlan=()=>{
  if(!S.examStudyRoutine)S.examStudyRoutine=[];
  const curSubjs=cur();
  let generated=0;
  const todayStr=dk();
  const todayDate=new Date(todayStr+'T00:00:00');

  curSubjs.forEach(s=>{
    const examDateStr=(S.examDates||{})[s.id];
    if(!examDateStr)return;
    const examDate=new Date(examDateStr+'T00:00:00');
    const dLeft=Math.round((examDate-todayDate)/864e5);
    if(dLeft<=0)return;

    const pendingUnits=(s.u||[]).filter(u=>!u.d);
    if(!pendingUnits.length)return;

    const step=Math.max(1,Math.floor(dLeft/(pendingUnits.length+1)));
    pendingUnits.forEach((u,idx)=>{
      const already=S.examStudyRoutine.find(rt=>rt.sub===s.n&&rt.unit===u.t);
      if(already)return;

      const offset=Math.min(dLeft-1,Math.max(1,(idx+1)*step));
      const targetDate=new Date(todayDate.getTime()+offset*864e5);
      const y=targetDate.getFullYear();
      const m=String(targetDate.getMonth()+1).padStart(2,'0');
      const d=String(targetDate.getDate()).padStart(2,'0');
      const planDateStr=`${y}-${m}-${d}`;
      const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const dayName=dayNames[targetDate.getDay()];

      S.examStudyRoutine.push({
        id:now()+Math.floor(Math.random()*1000),
        sub:s.n,
        unit:u.t,
        date:planDateStr,
        day:dayName,
        time:'18:00',
        done:false
      });
      generated++;
    });
  });

  save();R();
  if(generated>0){
    window.alert&&window.alert(`Generated study plan! ${generated} study sessions & alarms mapped out before exams.`);
    if(window.Notification && window.Notification.permission==='granted'){
      showPhoneNotif('Study Plan Created 📅', `${generated} study sessions & alarms mapped out for your exams!`);
    }
  } else {
    window.alert&&window.alert('Please set future Exam Dates for your subjects in Semester Exam tab first, or all units are already planned.');
  }
};

const cfg=()=>Object.assign({n:S.activeItem,i:'✨',g:3,r:6,type:'count',lblGood:'GREAT',lblMid:'AVRAGE',lblBad:'BAD'},curItem().cfg||{});

const cigL=(name,targetDate)=>{
  const it=name?(S.items[name]||curItem()):curItem();
  if(!it.log)it.log={};
  const d=targetDate||dk();
  return it.log[d]||(it.log[d]={n:0,c:0});
};
const plus=(targetDate)=>{const it=curItem(),l=cigL(null,targetDate);l.n++;l.c+=it.price;if(S.cig)S.cig=it;save();R()};
const minus=(targetDate)=>{const it=curItem(),l=cigL(null,targetDate);if(l.n>0){l.n--;l.c=Math.max(0,l.c-it.price);if(S.cig)S.cig=it;save();R()}};
window.logItem=(delta=1,targetDate)=>{
  if(delta>0) plus(targetDate);
  else if(delta<0) minus(targetDate);
};
window.logCig=window.logItem;
window.plus=plus;
window.minus=minus;
const addAmt=(targetDate)=>{
  const a=+val('#ca');if(!(a>0))return;
  const it=curItem(),l=cigL(null,targetDate);l.n++;l.c+=a;if(S.cig)S.cig=it;save();R();
};
window.setSelItemDay=k=>{window._selItemDay=k;R();};
window.setDayItemDirect=(targetDate)=>{
  const n=+val('#day_it_n_'+targetDate)||0;
  const c=+val('#day_it_c_'+targetDate)||0;
  const it=curItem();
  if(!it.log)it.log={};
  if(n<=0 && c<=0){
    delete it.log[targetDate];
  } else {
    it.log[targetDate]={n, c:c||(n*(it.price||0))};
  }
  if(S.cig)S.cig=it;
  save();R();
};
const mdays=()=>{const d=new Date();return[d.getFullYear(),d.getMonth(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),d.getDate()]};
const monthCig=(name)=>{
  const it=name?(S.items[name]||curItem()):curItem();
  if(!it||!it.log)return{n:0,c:0};
  return Object.keys(it.log).filter(k=>k.startsWith(tm())).reduce((a,k)=>({n:a.n+(it.log[k].n||0),c:a.c+(it.log[k].c||0)}),{n:0,c:0});
};
function monthPc(){const t=new Date().getDate();let s=0;for(let d=1;d<=t;d++)s+=pcH(tm()+'-'+pad(d));return Math.round(s/t)}
const cCl=x=>{const c=cfg();return x<c.g?'g':x<=c.r?'y':'r'};
const setPre=k=>{
  const p=PRE[k],name=p[1];
  S.activeItem=name;
  if(!S.items)S.items={};
  if(!S.items[name]){
    S.items[name]={
      cfg:{n:p[1],i:p[0],g:p[3],r:p[4],type:p[5]||'count',lblGood:p[6]||'GREAT',lblMid:p[7]||'AVRAGE',lblBad:p[8]||'BAD'},
      price:p[2],
      log:{}
    };
  }
  S.cig=S.items[name];
  save();R();
};
const saveCfg=()=>{
  const it=curItem(),o=cfg(),n=val('#cn').slice(0,20),i=val('#ci')||'✨',g=+val('#cg'),r=+val('#cr');
  if(!n)return;
  const gg=g>0?g:o.g;
  it.cfg={n,i,g:gg,r:r>=gg?r:Math.max(gg,o.r),t:n=='Cigarette'?'cig':''};
  if(n!==S.activeItem){
    S.items[n]=it;
    delete S.items[S.activeItem];
    S.activeItem=n;
  }
  S.cig=it;
  save();R();
};
const rst=b=>{
  if(b.dataset.c){
    curItem().log={};
    save();R();
  }else{
    b.dataset.c=1;
    b.textContent='Tap again to clear '+esc(cfg().n)+' entries';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='Reset entries';}},4000);
  }
};

<div class="card"><h3 style="margin-bottom:4px">Today's tasks</h3>${S.hab.map((x,i)=>`<div class="it" onclick="tickH(${i})"><div class="ck ${x.done[dk()]?'on':''}">${x.done[dk()]?'✓':'✗'}</div><span style="flex:1">${esc(x.t)}</span><button class="x" onclick="event.stopPropagation();delH(${i})" aria-label="Delete task">✕</button></div>`).join('')}<div class="f"><input id="nh" placeholder="New task (e.g. Go to gym)"><button class="btn s" onclick="addH()">Add</button></div></div>
<div class="card"><h3 style="margin-bottom:10px">This month</h3><div class="tr">${h}</div></div>`}
/* debts + reminders */
const normN=str=>(str||'').trim().toLowerCase();
const consolidateDebts=()=>{
  if(!S.debts||!S.debts.length)return;
  const map={}, settled=[];
  S.debts.forEach(d=>{
    const rem=d.a-(d.paid||0);
    if(rem<=0){settled.push(d);return;}
    const k=normN(d.n);
    if(!map[k])map[k]={name:d.n.trim(),net:0,lastD:d.d,ids:[]};
    map[k].ids.push(d.id);
    map[k].lastD=d.d;
    if(d.t==='owe')map[k].net+=rem;
    else map[k].net-=rem;
  });

  return `${acct()}

  <!-- iOS Edit Mode Header Banner (When Active) -->

      </div>
    </div>
  `:''}

  <!-- Main Unified Dynamic iOS Widget Grid -->
  <div class="ios-grid">
    ${S.widgetOrder.map(k=>renderWidget(k)).join('')}
  </div>

  <!-- Add Widget Button / Bottom Controls -->
  ${window._isEditMode?`
    <div class="ios-add-card" onclick="openWidgetModal()">＋ Add Widgets to Home</div>
  `:`
    <div style="text-align:center;margin:18px 0 8px">
      <button class="btn s o" onclick="toggleEditMode(true)" style="border-radius:20px;font-size:11.5px;padding:6px 16px">⚙️ Edit Home Screen Widgets</button>

}
function acct(){const c=window.CL;if(c.on===null||c.user)return '';
if(!c.on)return `<div class="card" style="${tint(CY)}"><b>Sync is off</b><div class="mut">Add your Firebase config to turn on Google sign-in. For now data stays on this phone.</div></div>`;
return `<div class="card row" style="${tint('var(--bl)')}"><div class="mut" style="flex:1;color:var(--tx)">Sign in to back up your data and use it on any phone.</div><button class="btn s" onclick="cloudIn()">Sign in with Google</button></div><div class="mut" id="syn" style="margin:-6px 0 10px">${esc(c.st||'')}</div>`}
function mStats(ym){
  const[y,m]=ym.split('-').map(Number),cm=ym==tm()?new Date().getDate():new Date(y,m,0).getDate(),gm=goal()*36e5;
  let ms=0,sd=0,hp=0;
  for(let d=1;d<=cm;d++){const k=ym+'-'+pad(d),v=k==dk()?todayMs():(S.study[k]||0);ms+=v;sd+=Math.min(1,v/gm);hp+=pcH(k)}
  
  const itemsBreakdown=[];
  let totalItemCost=0, totalItemCount=0;
  for(const [name, it] of Object.entries(S.items||{})){
    let totalN=0, totalC=0;
    for(const [d, val] of Object.entries(it.log||{})){
      if(d.startsWith(ym)){
        totalN += (val.n||0);
        totalC += (val.c||0);
      }
    }
    if(totalN>0||totalC>0){
      itemsBreakdown.push({name, n:totalN, c:totalC, i:it.cfg?.i||'✨'});
      totalItemCost += totalC;
      totalItemCount += totalN;
    }
  }
  return {cm,ms,stp:Math.round(sd/cm*100),chk:Math.round(hp/cm),itemsBreakdown,totalItemCost,totalItemCount,ex:spentOn(ym)};
}
function history(){
  const MS=[];
  for(let i=0;i<12;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);MS.push({d,a:mStats(d.getFullYear()+'-'+pad(d.getMonth()+1))})}
  const has=a=>a.ms>0||a.ex>0||a.totalItemCount>0||a.chk>0;
  const act=MS.filter(m=>has(m.a));
  const T=act.reduce((t,m)=>({ms:t.ms+m.a.ms,ex:t.ex+m.a.ex,itemCost:t.itemCost+m.a.totalItemCost,k:t.k+m.a.chk}),{ms:0,ex:0,itemCost:0,k:0});
  const ak=act.length?Math.round(T.k/act.length):0;
  
  const yearItemsMap={};
  for(const [name, it] of Object.entries(S.items||{})){
    let totalN=0, totalC=0;
    for(const [d, val] of Object.entries(it.log||{})){
      totalN += (val.n||0);
      totalC += (val.c||0);
    }
    if(totalN>0||totalC>0){
      yearItemsMap[name]={name, n:totalN, c:totalC, i:it.cfg?.i||'✨'};
    }
  }

  const bars=[...MS].reverse().map(m=>`<div style="flex:1;text-align:center"><div style="height:60px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(4,m.a.stp*.6)}px;border-radius:5px;background:${has(m.a)?cPct(m.a.stp):'#222d4a'}"></div></div><div class="mut" style="font-size:10px">${m.d.toLocaleDateString('en-IN',{month:'short'})}</div></div>`).join('');

  return `<h2>Year record</h2>
  <div class="card">
    <h3>Last 12 months</h3>
    <div class="g2" style="margin:10px 0 0">
      <div><div class="mut">Study</div><b>${hm(T.ms)}</b></div>
      <div><div class="mut">General Spent</div><b>${inr(T.ex)}</b></div>
      <div><div class="mut">Tracked Items</div><b>${inr(T.itemCost)}</b></div>
      <div><div class="mut">Checklist average</div><b style="color:${cPct(ak)}">${ak}%</b></div>
    </div>
    ${Object.keys(yearItemsMap).length?`
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08)">
        <div class="mut" style="margin-bottom:6px">Tracked items total:</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${Object.values(yearItemsMap).map(it=>`<span style="font-size:12px;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,0.06);color:#ffffff">${it.i} ${esc(it.name)}: <b>${it.n}</b> (${inr(it.c)})</span>`).join('')}
        </div>
      </div>`:''}
  </div>
  <div class="card"><h3 style="margin-bottom:10px">Study each month (vs your daily goal)</h3><div class="row" style="gap:4px;align-items:flex-end">${bars}</div></div>`+
  MS.map(m=>{
    const a=m.a,h=has(a);
    return `<div class="card" style="${h?'':'opacity:.5'}">
      <div class="row">
        <h3>${m.d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3>
        ${h?'':'<span class="mut">No data</span>'}
      </div>
      ${h?`<div class="g2" style="margin:10px 0 0">
        <div><div class="mut">Study</div><b style="color:${cPct(a.stp)}">${hm(a.ms)} · ${a.stp}%</b></div>
        <div><div class="mut">Spent</div><b style="color:${cBud(a.ex/S.tg.month*100)}">${inr(a.ex)}</b></div>
        <div><div class="mut">Checklist</div><b style="color:${cPct(a.chk)}">${a.chk}%</b></div>
        <div><div class="mut">Items Spent</div><b>${inr(a.totalItemCost)}</b></div>
      </div>
      ${a.itemsBreakdown.length?`
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-wrap:wrap;gap:6px">
          ${a.itemsBreakdown.map(it=>`<span style="font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.06);color:#ffffff">${it.i} ${esc(it.name)}: <b>${it.n}</b> (${inr(it.c)})</span>`).join('')}
        </div>`:''}`:''}
    </div>`;
  }).join('')+
  `<p class="mut" style="text-align:center">Every month stays saved, including older ones.</p>`;
}
R();
</script>
<script src="config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig=window.FIREBASE_CONFIG||{apiKey:""};
const CL=window.CL,BB=window.BB;
const note=t=>{CL.st=t;const e=document.getElementById('syn');if(e)e.textContent=t};
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith("PASTE")){CL.on=false;BB.render()}else{
CL.on=true;
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let ref=null,unsub=null,tm=null;
const write=async()=>{try{const S=BB.get();await setDoc(ref,{data:JSON.stringify(S),ts:S.ts||Date.now()});note('Synced ✓')}catch(e){note('Sync failed. Will retry on the next change.')}};
window.cloudPush=()=>{if(!ref)return;note('Saving…');clearTimeout(tm);tm=setTimeout(write,1200)};
window.cloudIn=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,p);else note('Sign-in failed ('+(e.code||'error')+')')}};
window.cloudOut=()=>signOut(auth);
const hasData=(o)=>{
  if(!o) return false;
  const hasExp=(o.exp&&o.exp.length>0);
  const hasStudy=(o.study&&Object.keys(o.study).some(k=>o.study[k]>0));
  const hasCig=(o.cig&&o.cig.log&&Object.keys(o.cig.log).length>0);
  const hasItems=(o.items&&Object.values(o.items).some(it=>it.log&&Object.keys(it.log).length>0));
  const hasHab=(o.hab&&o.hab.some(h=>Object.keys(h.done||{}).length>0));
  const hasDebts=(o.debts&&o.debts.length>0);
  const hasRasan=(o.rasan&&o.rasan.logs&&o.rasan.logs.length>0);
  return hasExp||hasStudy||hasCig||hasItems||hasHab||hasDebts||hasRasan;
};

// Auto backup to localStorage
const autoBackup=(o)=>{
  try{
    if(hasData(o)){
      localStorage.setItem('bb_backup_latest', JSON.stringify(o));
      localStorage.setItem('bb_backup_'+dk(), JSON.stringify(o));
    }
  }catch(e){}
};

onAuthStateChanged(auth,async u=>{
 CL.user=u?{n:u.displayName||u.email}:null;
 if(unsub){unsub();unsub=null}
 if(!u){ref=null;CL.st='';BB.render();return}
 ref=doc(db,'users',u.uid);CL.st='Syncing…';BB.render();
 try{
   const snap=await getDoc(ref), loc=BB.get();
   if(snap.exists()){
     const r=JSON.parse(snap.data().data);
     autoBackup(r);
     const cloudHasData=hasData(r);
     const locHasData=hasData(loc);

     if(cloudHasData && !locHasData){
       // New device (like laptop) signing in: ALWAYS pull cloud data! Never overwrite with blank state!
       BB.set(r);
       note('Synced ✓');
     } else if(cloudHasData && locHasData){
       // Both have data: newer timestamp wins, but back up both!
       if((r.ts||0)>=(loc.ts||0)){
         BB.set(r); note('Synced ✓');
       } else {
         write();
       }
     } else if(!cloudHasData && locHasData){
       // Cloud is empty, but local device has user data: write to cloud!
       write();
     } else {
       // Both empty: load cloud
       BB.set(r); note('Synced ✓');
     }
   } else {
     // Cloud doc does not exist yet: write local state if it has data
     write();
   }
 } catch(e){
   note('Could not reach the cloud. Using data on this phone.');
 }
 unsub=onSnapshot(ref,x=>{
   if(x.metadata.hasPendingWrites||!x.exists())return;
   try{
     const r=JSON.parse(x.data().data);
     autoBackup(r);
     if((r.ts||0)>(BB.get().ts||0)){
       BB.set(r);
     }
   }catch(e){}
 });
});
}
</script>

if('serviceWorker' in navigator){

  });
}
